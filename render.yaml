# Render Blueprint para ELEMENT Cotizador (versión gratuita)
# Crea 8 Web Services públicos. Todos son accesibles por internet,
# pero el frontend solo debería apuntar al gateway.
#
# IMPORTANTE: Render Blueprint puede requerir plan de pago.
# Si no podés usar Blueprint, seguí las instrucciones de RENDER.md para crear
# los servicios manualmente uno por uno con los mismos Build/Start Commands.
#
# ANTES DE DESPLEGAR:
# 1. Editá el envVarGroup `element-secrets` con tu JWT_SECRET, JWT_REFRESH_SECRET y SUPABASE_DATABASE_URL reales.
# 2. JWT_SECRET debe ser el MISMO en gateway y todos los servicios.
# 3. JWT_REFRESH_SECRET solo lo usa auth-service y debe ser diferente de JWT_SECRET.

envVarGroups:
  - name: element-secrets
    envVars:
      - key: JWT_SECRET
        value: cambia-esto-por-un-secreto-largo-y-seguro
      - key: JWT_REFRESH_SECRET
        value: cambia-esto-por-otro-secreto-largo-y-seguro
      - key: SUPABASE_DATABASE_URL
        value: postgresql://postgres.ktmsemzpnpvlcyxjtqlf:TU_PASSWORD@aws-1-us-east-1.pooler.supabase.com:5432/postgres

services:
  - type: web
    name: element-gateway
    runtime: node
    plan: free
    region: oregon
    rootDir: api-gateway
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GATEWAY_PORT
        value: 3000
      - key: CORS_ALLOWED_ORIGINS
        value: https://cotzador-elemt.vercel.app
      - key: AUTH_URL
        value: https://element-auth.onrender.com
      - key: QUOTES_URL
        value: https://element-quotes.onrender.com
      - key: PAYMENTS_URL
        value: https://element-payments.onrender.com
      - key: CONFIG_URL
        value: https://element-config.onrender.com
      - key: CATALOG_URL
        value: https://element-catalog.onrender.com
      - key: PUBLIC_URL
        value: https://element-public.onrender.com
      - key: TILE_CALCULATOR_URL
        value: https://element-tile.onrender.com
      - fromGroup: element-secrets

  - type: web
    name: element-auth
    runtime: node
    plan: free
    region: oregon
    rootDir: services/auth-service
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ALLOWED_ORIGINS
        value: https://cotzador-elemt.vercel.app
      - key: PORT
        value: 3001
      - key: AUTH_DATABASE_SCHEMA
        value: element_auth
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - fromGroup: element-secrets

  - type: web
    name: element-quotes
    runtime: node
    plan: free
    region: oregon
    rootDir: services/quotes-service
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ALLOWED_ORIGINS
        value: https://cotzador-elemt.vercel.app
      - key: PORT
        value: 3002
      - key: QUOTES_DATABASE_SCHEMA
        value: quotes
      - key: INTERNAL_API_KEY
        value: element-internal-key
      - fromGroup: element-secrets

  - type: web
    name: element-payments
    runtime: node
    plan: free
    region: oregon
    rootDir: services/payments-service
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ALLOWED_ORIGINS
        value: https://cotzador-elemt.vercel.app
      - key: PORT
        value: 3003
      - key: PAYMENTS_DATABASE_SCHEMA
        value: payments
      - key: QUOTES_INTERNAL_URL
        value: https://element-quotes.onrender.com
      - key: INTERNAL_API_KEY
        value: element-internal-key
      - fromGroup: element-secrets

  - type: web
    name: element-config
    runtime: node
    plan: free
    region: oregon
    rootDir: services/config-service
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ALLOWED_ORIGINS
        value: https://cotzador-elemt.vercel.app
      - key: PORT
        value: 3004
      - key: CONFIG_DATABASE_SCHEMA
        value: config
      - fromGroup: element-secrets

  - type: web
    name: element-catalog
    runtime: node
    plan: free
    region: oregon
    rootDir: services/catalog-service
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ALLOWED_ORIGINS
        value: https://cotzador-elemt.vercel.app
      - key: PORT
        value: 3005
      - key: CATALOG_DATABASE_SCHEMA
        value: catalog
      - fromGroup: element-secrets

  - type: web
    name: element-public
    runtime: node
    plan: free
    region: oregon
    rootDir: services/public-service
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ALLOWED_ORIGINS
        value: https://cotzador-elemt.vercel.app
      - key: PORT
        value: 3006
      - key: PUBLIC_DATABASE_SCHEMA
        value: site
      - fromGroup: element-secrets

  - type: web
    name: element-tile
    runtime: node
    plan: free
    region: oregon
    rootDir: services/tile-calculator-service
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ALLOWED_ORIGINS
        value: https://cotzador-elemt.vercel.app
      - key: PORT
        value: 3007
      - key: TILE_CALCULATOR_DATABASE_SCHEMA
        value: tile_calculator
      - fromGroup: element-secrets
